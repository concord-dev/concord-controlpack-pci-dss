apiVersion: concord.dev/v1
kind: Control

metadata:
  id: PCI-DSS-4.2-no-end-user-messaging
  name: pci-dss-4-2-no-end-user-messaging
  title: PAN is never sent unprotected via end-user messaging technologies
  framework: pci-dss
  category: Protect Cardholder Data
  severity: high
  tags:
    - pci-dss
    - pan
    - transit
    - dlp
    - messaging
  owners:
    - team: security

spec:
  description: |
    PCI DSS v4.0 Requirement 4.2.2 requires that the primary account number
    (PAN) is never sent, and a policy prohibits sending it, via end-user
    messaging technologies such as email, SMS, and chat unless it is
    rendered unreadable with strong cryptography. Concord verifies a signed
    policy attestation that PAN messaging is prohibited, that the prohibition
    covers email, SMS, and chat, and that DLP tooling enforces it.

  rationale: |
    End-user messaging is a classic PAN-leakage path: a support agent
    pastes a full card number into a chat thread or replies to a customer
    email, and the data lands in systems that were never scoped for PCI.
    The defensible control combines a written prohibition with DLP
    enforcement across every messaging channel, and the policy fails closed
    unless the prohibition is explicitly attested and each of the named
    channels is in scope.

  evidence:
    - id: pan_messaging_policy
      source: github
      type: file_glob
      fixture: ../tests/fixtures/pci-dss-4-2-no-end-user-messaging-pass.json
      params:
        repo: ${env.CONCORD_REPO}
        paths:
          - "docs/security/pci/pan-messaging-policy.md"
        parse: frontmatter

  policy:
    engine: rego
    package: concord.pci_dss.r_4_2
    file: ../policies/pci-dss-4-2-no-end-user-messaging.rego

  remediation:
    runbook: docs/remediation/pci-dss-4-2-no-end-user-messaging.md
    auto_fix: false
    estimated_effort: 1d

  mappings:
    pci_dss:
      - "4.2"
      - "4.2.2"
    nist_800_53:
      - "SC-8"
    iso27001:
      - "A.8.24"
    soc2:
      - "C1.1"

  status: stable
  blocking: true
