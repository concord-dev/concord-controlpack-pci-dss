apiVersion: concord.dev/v1
kind: Control

metadata:
  id: PCI-DSS-3.5-encryption-key-management
  name: cardholder-data-key-rotation
  title: KMS keys protecting cardholder data rotate at least annually
  framework: pci-dss
  category: Protect Cardholder Data
  severity: critical
  tags:
    - pci-dss
    - kms
    - key-rotation
  owners:
    - team: platform

spec:
  description: |
    PCI DSS v4.0 Requirement 3.5 requires PAN to be unreadable wherever it
    is stored, including via cryptography with strong key management.
    Specifically 3.6.1 + 3.6.4 require key rotation at defined intervals
    (annually is the de-facto minimum auditors accept). Concord verifies
    every KMS key tagged pci=true has rotation enabled and a rotation
    cadence of <= 365 days.

  rationale: |
    Stale keys are the most common PCI 3.x audit finding — they're
    operationally invisible, so without automated tracking the org has no
    way to demonstrate compliance.

  evidence:
    - id: aws_kms
      source: aws
      type: kms_keys
      fixture: ../tests/fixtures/key-rotation-pass.json
      params:
        region: ${env.AWS_REGION}

  policy:
    engine: rego
    package: concord.pci_dss.key_management
    file: ../policies/key_management.rego

  remediation:
    runbook: docs/remediation/pci-dss-3.5.md
    auto_fix: false
    estimated_effort: 1d

  mappings:
    pci_dss:
      - "3.5"
      - "3.6.1"
      - "3.6.4"
    soc2:
      - "C1.1"

  status: stable
  blocking: true
