apiVersion: concord.dev/v1
kind: Control
metadata:
  id: PCI-DSS-9.4-media-protection
  name: media-handling-attested
  title: Cardholder media handling and disposal procedures are documented and signed
  framework: pci-dss
  category: Physical Security
  severity: high
  tags: [pci-dss, physical, disposal]
  owners:
    - team: it-operations
spec:
  description: |
    PCI DSS v4.0 §9.4 requires media containing cardholder data to be
    physically secured and properly destroyed when no longer needed.
    Concord reads a cosigned media-handling attestation.
  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/9.4-pass.json
      params:
        kind: media_handling
  policy:
    engine: rego
    package: concord.pci_dss.r_9_4
    file: ../policies/r_9_4.rego
  mappings:
    pci_dss: ["9.4", "9.4.3", "9.4.5"]
    iso27001: ["A.7.10", "A.7.14"]
    hipaa: ["164.310(d)(2)"]
  status: stable
  blocking: true
